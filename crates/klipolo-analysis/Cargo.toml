[package]
name = "klipolo-analysis"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Clip analysis: the 16 kHz mono WAV Meta's speech models take, its chunks at silences, the per-file cache and the clip's timed words"

[dependencies]
# Several requests at once (`StreamExt::buffer_unordered`).
futures = "0.3"
# Sound decode (`audio::decode::{probe, decode}`: 48 kHz f32, streamed); no FFmpeg calls of our own.
klipolo-engine = { path = "../klipolo-engine" }
# The Meta adapter (`providers::meta`) only: nothing else here sees a Meta type.
klipolo-meta = { path = "../klipolo-meta" }
# `Us`, `RangeUs`, and the `Transcript` of `Word`s the captions read.
klipolo-model = { path = "../klipolo-model" }
# Atomic writes for the WAV and the cache's JSON (`durable::write_atomic`).
klipolo-platform = { path = "../klipolo-platform" }
# One list of filler sounds per language (`timing::fillers`).
klipolo-speech-wire = { path = "../klipolo-speech-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The content key, at the lockfile's version (the engine builds it).
sha2 = "0.10.9"
thiserror = "2"
# Reading the WAV off the async threads (`spawn_blocking`).
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
