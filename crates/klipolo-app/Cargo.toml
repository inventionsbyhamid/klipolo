[package]
name = "klipolo-app"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Klipolo's desktop app: the Tauri shell around the preview and export engine"
default-run = "klipolo-app"

# The app's logic without Tauri types (credentials, the device id, analysis), so it tests on Linux.
[lib]
name = "klipolo_app"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
klipolo-engine = { path = "../klipolo-engine" }
# The bundled fonts' folder, configured once for the engine at launch.
klipolo-fonts = { path = "../klipolo-fonts" }
klipolo-model = { path = "../klipolo-model" }
# The one shared Meta adapter (`providers::meta::Meta`) the analysis and chat use, built from the saved credentials,
# and the `ImageMaker` interface stickers and title cards are drawn through (Muse Image behind it).
klipolo-analysis = { path = "../klipolo-analysis" }
# The Meta client: key checks, the relay's device registration and status.
klipolo-meta = { path = "../klipolo-meta" }
# The neutral scene items and speaker turns chat reads (the app turns the analysis results into them), and a chat
# reply's text made fit to show (`sanitize::reply`).
klipolo-chat = { path = "../klipolo-chat" }
# The OS's logs folder for the app's log; the analysis thread's QoS.
klipolo-platform = { path = "../klipolo-platform" }
# Screen recording: the take's worker (`--record-worker`, this binary), the setup read without capture or prompts, and
# the OS's capture backends (`real-capture`, which only the app turns on).
klipolo-capture = { path = "../klipolo-capture", features = ["real-capture"] }
# `protocol-asset`: the page reads imported media and the engine's thumbnails through `asset:` URLs.
tauri = { version = "=2.12.1", features = ["protocol-asset"] }
# The file picker behind Add files.
tauri-plugin-dialog = "=2.8.1"
# Reading Muse Image's PNGs and writing a sticker's cut-out (the version and features the engine already builds).
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The secret store's error.
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# The import's types for the page (`cargo test` writes them to apps/desktop/src/bindings).
ts-rs = "12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Keychain (generic passwords) for the Meta key and the relay token; the version the lockfile already has.
security-framework = "3.7"

[dev-dependencies]
# A portrait photo's EXIF orientation, a TIFF to import, and a full disk's errno, in the import and save tests.
image = { version = "0.25", default-features = false, features = ["jpeg", "tiff"] }
# Reading a test file's streams as the probe does (the engine's FFmpeg bindings, at their version and features).
ffmpeg = { package = "ffmpeg-next", version = "=9.0.0", default-features = false, features = ["codec", "format"] }
libc = "0.2"
# The recorder's tests: the fake backend (no device, no prompt) beside the real one the app builds.
klipolo-capture = { path = "../klipolo-capture", features = ["real-capture", "synthetic"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
# Meta and the relay, mocked for the credentials tests.
wiremock = "0.6"
