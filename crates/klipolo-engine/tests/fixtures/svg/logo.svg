<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- A synthetic logo for the importer's test: a badge with a gradient, a ring and a check mark. -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB000"/>
      <stop offset="1" stop-color="#E8453C"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="40" fill="url(#sun)"/>
  <g transform="translate(100 0)">
    <rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="#2D6CDF" stroke-width="6"/>
    <path d="M25 50 L45 70 L75 30" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
