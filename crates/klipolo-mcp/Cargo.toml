[package]
name = "klipolo-mcp"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Other apps edit the open project over MCP, through chat's own tools and compiler"

[dependencies]
# Chat's tools, context and compiler: an app's call is read, checked and compiled exactly as chat's are.
klipolo-chat = { path = "../klipolo-chat" }
# The project, its transactions and history, the time helpers and the cleaning of app names.
klipolo-model = { path = "../klipolo-model" }
# Session ids.
rand = "0.9"
# What agents read about a proposal (`ProposalOutcome`).
serde = { version = "1", features = ["derive"] }
# JSON-RPC messages.
serde_json = "1"
