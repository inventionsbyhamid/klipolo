[package]
name = "klipolo-meta"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license.workspace = true
description = "One HTTP client for Meta's Model API: direct with the person's own key, or through Klipolo's relay with an access-code token."
publish = false

[dependencies]
# Muse Image sends its PNGs as base64 (the version the lockfile already has).
base64 = "0.22.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
