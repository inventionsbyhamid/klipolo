[package]
name = "klipolo-speech-wire"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Klipolo's speech timing rules: where a heard word's sound starts and ends, how close a transcript is to its reference, each language's hesitations, and a process's lowered priority. Pure Rust, through the OS's own calls."
publish = false

[dependencies]
klipolo-model = { path = "../klipolo-model" }

# `lower`: a process's priority (nice, QoS, the scheduler's policy) through the OS's own calls.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# SetPriorityClass on the process itself; the version and features klipolo-platform already builds.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
