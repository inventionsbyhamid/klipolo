[package]
name = "klipolo-speech-wire"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Klipolo's speech workers' shared wire: the protocol, the request loop every engine runs behind (`serve`), words and the worker's lowered priority. Pure Rust, so whisper's worker and klipolo-asr share it without sharing a ggml."
publish = false

[dependencies]
klipolo-model = { path = "../klipolo-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `lower`: the worker's priority (nice, QoS, the scheduler's policy) through the OS's own calls.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# SetPriorityClass on the worker's own process; the version and features klipolo-platform already builds.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
