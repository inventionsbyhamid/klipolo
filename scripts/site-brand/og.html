<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klipolo share image</title>
<!-- The share image (site/assets/og.png), 1200x630. render.py screenshots this page; it isn't served. -->
<style>
@font-face {
  font-family: "Schibsted Grotesk";
  src: url("/site/assets/fonts/schibsted-grotesk.woff2") format("woff2");
  font-weight: 400 700;
}
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; }
body {
  position: relative;
  overflow: hidden;
  background: #f2f3f1;
  color: #17181a;
  font-family: "Schibsted Grotesk", sans-serif;
  font-kerning: normal;
  -webkit-font-smoothing: antialiased;
}
.card {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 64px;
  padding: 64px 72px;
}
.side { display: flex; flex-direction: column; justify-content: space-between; }
.mark { display: flex; align-items: center; gap: 14px; }
.mark img { width: 46px; height: 46px; }
.mark span { font-size: 36px; font-weight: 600; line-height: 1; letter-spacing: -.03em; }
h1 {
  font-size: 100px;
  font-weight: 500;
  line-height: .98;
  letter-spacing: -.045em;
}
/* The address, on a hairline that runs to the playhead, as on the site. */
.addr { display: flex; align-items: center; gap: 22px; font-size: 28px; font-weight: 500; color: #5e6166; }
.rail { position: relative; flex: 1; height: 2px; border-radius: 1px; background: #17181a; }
.rail::after {
  content: "";
  position: absolute;
  right: -1px;
  top: -11px;
  width: 3px;
  height: 24px;
  border-radius: 2px;
  background: #e0301a;
}
/* One real frame of a short Klipolo made. */
.frame {
  align-self: center;
  width: 282px;
  height: 502px;
  overflow: hidden;
  border-radius: 12px;
  outline: 1px solid #d9dbd8;
  outline-offset: -1px;
}
.frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div class="card">
  <div class="side">
    <div class="mark"><img src="/site/assets/klipolo-icon.svg" alt=""><span>Klipolo</span></div>
    <h1>Ask for a short,<br>and it’s done.</h1>
    <p class="addr"><span>klipolo.com</span><span class="rail"></span></p>
  </div>
  <div class="frame"><img src="/site/assets/img/short-1.jpg" alt=""></div>
</div>
</body>
</html>
