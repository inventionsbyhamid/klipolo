# The relay on the server: the Docker Compose service "klipolo-relay" in the
# Coolify project "klipolo". The image is built on the server and never
# pulled (see README.md). Coolify's Traefik routes api.klipolo.com to port
# 8080 over the coolify network; no host ports.
services:
  klipolo-relay:
    image: klipolo-relay:${RELAY_TAG}
    pull_policy: never
    restart: unless-stopped
    environment:
      RELAY_DB_PATH: /data/relay.db
      # 2 alignments at once with 3 threads each, measured on this server.
      ALIGN_CONCURRENCY: "2"
      ALIGN_THREADS: "3"
      DEVICE_CAP_USD: ${DEVICE_CAP_USD:-2.00}
      GLOBAL_CAP_USD: ${GLOBAL_CAP_USD:-40.00}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-muse-spark-1.3,muse-spark-1.2,muse-voice-transcribe-1.0}
      # Empty until the owner sets it: proxied calls answer 503 "Relay not configured."
      META_API_KEY: ${META_API_KEY:-}
    volumes:
      - klipolo-relay-data:/data
    # Alignment audio waits in /tmp: up to 8 requests of 19 MB. In memory
    # (counted in the 6 GB), so none of it outlives a crash or a restart.
    tmpfs:
      - /tmp:size=200m,mode=1777
    cpus: 8
    mem_limit: 6g
    memswap_limit: 6g
    # uvicorn waits for calls in flight on SIGTERM, including streams drained
    # after a client left. Two 10-minute alignments at once take longer than
    # this, so restart only when idle (README.md).
    stop_grace_period: 330s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.klipolo-relay-to-https.redirectscheme.scheme=https
      - traefik.http.routers.klipolo-relay-http.entrypoints=http
      - traefik.http.routers.klipolo-relay-http.rule=Host(`api.klipolo.com`)
      - traefik.http.routers.klipolo-relay-http.middlewares=klipolo-relay-to-https
      - traefik.http.routers.klipolo-relay-http.service=klipolo-relay
      # No compress middleware: it can hold back small streamed events.
      - traefik.http.routers.klipolo-relay-https.entrypoints=https
      - traefik.http.routers.klipolo-relay-https.rule=Host(`api.klipolo.com`)
      - traefik.http.routers.klipolo-relay-https.tls=true
      - traefik.http.routers.klipolo-relay-https.tls.certresolver=letsencrypt
      - traefik.http.routers.klipolo-relay-https.service=klipolo-relay
      - traefik.http.routers.klipolo-relay-https.middlewares=klipolo-relay-limit
      # Rate limits per client IP: 10 requests a second with bursts of 30.
      # Registering is open to anyone and is where access codes are tried,
      # so it has its own router with a stricter limit: 10 a minute, bursts
      # of 5. Its longer rule gives it the higher priority.
      - traefik.http.middlewares.klipolo-relay-limit.ratelimit.average=10
      - traefik.http.middlewares.klipolo-relay-limit.ratelimit.period=1s
      - traefik.http.middlewares.klipolo-relay-limit.ratelimit.burst=30
      - traefik.http.middlewares.klipolo-relay-register-limit.ratelimit.average=10
      - traefik.http.middlewares.klipolo-relay-register-limit.ratelimit.period=1m
      - traefik.http.middlewares.klipolo-relay-register-limit.ratelimit.burst=5
      - traefik.http.routers.klipolo-relay-register.entrypoints=https
      - traefik.http.routers.klipolo-relay-register.rule=Host(`api.klipolo.com`) && Method(`POST`) && Path(`/v1/devices`)
      - traefik.http.routers.klipolo-relay-register.tls=true
      - traefik.http.routers.klipolo-relay-register.tls.certresolver=letsencrypt
      - traefik.http.routers.klipolo-relay-register.middlewares=klipolo-relay-register-limit
      - traefik.http.routers.klipolo-relay-register.service=klipolo-relay
      - traefik.http.services.klipolo-relay.loadbalancer.server.port=8080

volumes:
  klipolo-relay-data:
    name: klipolo-relay-data

networks:
  coolify:
    external: true
