# The relay on the server: the Docker Compose service "klipolo-relay" in the
# Coolify project "klipolo". The image is built on the server and never
# pulled (see README.md). Coolify's Traefik routes api.klipolo.com to port
# 8080 over the coolify network; no host ports.
services:
  klipolo-relay:
    image: klipolo-relay:${RELAY_TAG}
    pull_policy: never
    restart: unless-stopped
    environment:
      RELAY_DB_PATH: /data/relay.db
      # 2 alignments at once with 3 threads each, measured on this server.
      ALIGN_CONCURRENCY: "2"
      ALIGN_THREADS: "3"
      DEVICE_CAP_USD: ${DEVICE_CAP_USD:-2.00}
      GLOBAL_CAP_USD: ${GLOBAL_CAP_USD:-40.00}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-muse-spark-1.3,muse-spark-1.2,muse-voice-transcribe-1.0}
      # Empty until the owner sets it: proxied calls answer 503 "Relay not configured."
      META_API_KEY: ${META_API_KEY:-}
    volumes:
      - klipolo-relay-data:/data
    cpus: 8
    mem_limit: 6g
    memswap_limit: 6g
    # uvicorn waits for calls in flight on SIGTERM, including streams drained
    # after a client left and alignments of up to 10 minutes of audio.
    stop_grace_period: 330s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.klipolo-relay-to-https.redirectscheme.scheme=https
      - traefik.http.routers.klipolo-relay-http.entrypoints=http
      - traefik.http.routers.klipolo-relay-http.rule=Host(`api.klipolo.com`)
      - traefik.http.routers.klipolo-relay-http.middlewares=klipolo-relay-to-https
      - traefik.http.routers.klipolo-relay-http.service=klipolo-relay
      # No compress middleware: it can hold back small streamed events.
      - traefik.http.routers.klipolo-relay-https.entrypoints=https
      - traefik.http.routers.klipolo-relay-https.rule=Host(`api.klipolo.com`)
      - traefik.http.routers.klipolo-relay-https.tls=true
      - traefik.http.routers.klipolo-relay-https.tls.certresolver=letsencrypt
      - traefik.http.routers.klipolo-relay-https.service=klipolo-relay
      - traefik.http.services.klipolo-relay.loadbalancer.server.port=8080

volumes:
  klipolo-relay-data:
    name: klipolo-relay-data

networks:
  coolify:
    external: true
