[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klipolo-relay"
version = "0.1.0"
description = "Relay for Klipolo: access codes, metered Meta Model API access and word alignment."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.16",
    "respx>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
