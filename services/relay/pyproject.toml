[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klipolo-relay"
version = "0.1.0"
description = "Relay for Klipolo: access codes, metered Meta Model API access and word alignment."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.20",
    # Romanizes words in other scripts for the aligner (relay/text_norm.py).
    "uroman>=1.3.1.1,<2",
]

[project.optional-dependencies]
# Word alignment. Install the CPU builds from https://download.pytorch.org/whl/cpu;
# 2.8 is the last release with torchaudio's forced_align. The image installs
# exact versions from requirements-torch.lock and requirements.lock.
align = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
]
dev = [
    "pytest>=8",
    "httpx2>=2.16",
    "respx>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests need torch and the MMS model, so they run in the container:
# pytest -m slow (or -m "slow or not slow" for everything).
addopts = ["-m", "not slow"]
markers = ["slow: needs torch and the MMS alignment model"]
